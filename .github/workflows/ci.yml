name: CI

on:
  push:
    branches: [main, "logitech-*"]
  pull_request:
  workflow_dispatch:

# 同じブランチへの連続 push では古い run を自動キャンセル。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show
      # target/ と ~/.cargo をキャッシュ (Cargo.lock + toolchain がキー)。main 以外の push でも保存する。
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Check
        run: cargo check --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --release --locked -p device-hub -p devhub-obs -p devhub-agent
      - name: Stage Windows distribution
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: device-hub-windows-x64
          path: dist/
      # 実機解析用 (配布物には入れない)。G HUB を終了してから実行する。
      - name: Build HID++ tools
        run: cargo build --release --locked -p devhub-hid --example hidpp_probe --example hidpp_rgb --example hidpp_onboard
      - uses: actions/upload-artifact@v4
        with:
          name: hidpp-probe
          path: |
            target/release/examples/hidpp_probe.exe
            target/release/examples/hidpp_rgb.exe
            target/release/examples/hidpp_onboard.exe
